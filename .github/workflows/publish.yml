name: Publish PennyMatters demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the site
        run: |
          mkdir -p _site
          if [ -f index.html ]; then cp index.html _site/; fi
          if [ -f pennymatters-website.zip ]; then unzip -o pennymatters-website.zip -d _site; fi
          if [ -d _site/pennymatters-site ]; then cp -r _site/pennymatters-site/. _site/; fi
          ls -la _site
          test -f _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
